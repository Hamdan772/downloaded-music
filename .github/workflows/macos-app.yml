name: macOS app

# Builds melograb.app + a drag-to-install DMG for Apple Silicon and Intel,
# self-tests the finished app, and publishes a GitHub release with the DMGs
# when a v* tag is pushed -- or when run by hand with "release" ticked, in
# which case the workflow creates the v<version> tag itself. Every run's
# DMGs are also under its "Artifacts".
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release (creates tag v<version> from melograb/__init__.py)"
        type: boolean
        default: false
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:  # branch pushes only build when the app could have changed (tags always build)
      - "melograb/**"
      - "packaging/**"
      - "assets/**"
      - "run_gui.py"
      - "requirements.txt"
      - ".github/workflows/macos-app.yml"

jobs:
  build:
    name: DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import melograb; print(melograb.__version__)')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match melograb.__version__ (${version})"; exit 1
          fi

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build app and DMG
        env:
          PYTHON: python
          MELOGRAB_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/build_macos.sh

      - name: Online smoke test (real album fetch + one download)
        # YouTube sometimes blocks datacenter IPs, so this informs but never fails the build.
        continue-on-error: true
        run: dist/melograb.app/Contents/MacOS/melograb --self-test --online

      - uses: actions/upload-artifact@v4
        with:
          name: melograb-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # to see existing tags

      - name: Work out the version and tag
        id: meta
        run: |
          version="$(python3 -c 'import melograb; print(melograb.__version__)')"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "$tag" ] || { echo "::error::tag ${GITHUB_REF_NAME} != $tag"; exit 1; }
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists -- bump __version__ in melograb/__init__.py first"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      - name: Prepare assets and notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          mkdir release
          # Stable names, so README links to releases/latest/download/... always work.
          for f in built/*.dmg; do
            arch="${f##*-macos-}"
            cp "$f" "release/melograb-macos-${arch}"
          done
          (cd release && sha256sum *.dmg > SHA256SUMS.txt)
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          Download **melograb-macos-arm64.dmg** for Apple Silicon (M1 and newer) or **melograb-macos-x86_64.dmg** for Intel, open it and drag melograb into Applications.

          First launch: right-click melograb in Applications and choose **Open** (macOS 15+: open it once, then *System Settings › Privacy & Security › Open Anyway*). The app isn't notarized by Apple yet.
          NOTES
          ls -l release; cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: melograb ${{ steps.meta.outputs.tag }}
          body_path: notes.md
          make_latest: true
          files: |
            release/*.dmg
            release/SHA256SUMS.txt
