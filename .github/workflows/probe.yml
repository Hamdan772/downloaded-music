name: probe metadata sources
# Temporary: prints what Spotify/Apple really return, for debugging lookups.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml", "scripts/probe_metadata.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python scripts/probe_metadata.py
